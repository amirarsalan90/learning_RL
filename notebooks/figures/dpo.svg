<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="250" fill="#ffffff"/><text x="20" y="26" text-anchor="start" fill="#333" font-size="13" font-weight="bold">DPO: offline. Sample once, then train on fixed preference pairs</text>
<rect x="20" y="45" width="165" height="76" rx="9" fill="#f3f3f3" stroke="#777" stroke-width="2" stroke-dasharray="6,4"/>
<text x="102.5" y="69.5" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Once, up front</text>
<text x="102.5" y="87.5" text-anchor="middle" fill="#333" font-size="13">π_ref samples 4</text>
<text x="102.5" y="105.5" text-anchor="middle" fill="#333" font-size="13">replies per prompt</text>
<rect x="210" y="45" width="165" height="76" rx="9" fill="#f3f3f3" stroke="#777" stroke-width="2" stroke-dasharray="6,4"/>
<text x="292.5" y="69.5" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Make pairs</text>
<text x="292.5" y="87.5" text-anchor="middle" fill="#333" font-size="13">chosen = a ✓ reply</text>
<text x="292.5" y="105.5" text-anchor="middle" fill="#333" font-size="13">rejected = a ✗ reply</text>
<path d="M185,83 L208,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="400" y="45" width="340" height="76" rx="9" fill="#e6f4ec" stroke="#2e9a5b" stroke-width="2"/>
<text x="570.0" y="69.5" text-anchor="middle" fill="#1b5e37" font-size="13" font-weight="bold">Training loop (no sampling, no reward)</text>
<text x="570.0" y="87.5" text-anchor="middle" fill="#1b5e37" font-size="13">margin = β[(log π − log π_ref)(✓) − (same)(✗)]</text>
<text x="570.0" y="105.5" text-anchor="middle" fill="#1b5e37" font-size="13">loss = −log σ(margin)</text>
<path d="M375,83 L398,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="400" y="150" text-anchor="start" fill="#555" font-size="12">Pushes log π(✓) up and log π(✗) down, relative to π_ref.</text>
<text x="400" y="168" text-anchor="start" fill="#555" font-size="12">Can only learn from replies already in the dataset:</text>
<text x="400" y="186" text-anchor="start" fill="#555" font-size="12">prompts with no ✓ (or no ✗) reply give no pair at all.</text>
<text x="20" y="214" text-anchor="start" fill="#555" font-size="12" font-weight="bold">Models in GPU memory</text>
<rect x="20" y="222" width="25" height="24" rx="5" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="32.5" y="239" text-anchor="middle" fill="#1d3f6e" font-size="13" font-weight="bold">π</text>
<text x="53" y="239" text-anchor="start" fill="#555" font-size="12">policy (trained)</text>
<rect x="175.0" y="222" width="61" height="24" rx="5" fill="#f3f3f3" stroke="#777" stroke-width="1.5"/>
<text x="205.5" y="239" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">π_ref</text>
<text x="244.0" y="239" text-anchor="start" fill="#555" font-size="12">frozen start (log-probs precomputed)</text></svg>
