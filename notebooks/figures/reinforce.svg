<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="220" fill="#ffffff"/><text x="20" y="26" text-anchor="start" fill="#333" font-size="13" font-weight="bold">REINFORCE: one gradient step per batch, then sample again</text>
<rect x="20" y="45" width="165" height="76" rx="9" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
<text x="102.5" y="69.5" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">1 · Sample</text>
<text x="102.5" y="87.5" text-anchor="middle" fill="#333" font-size="13">16 prompts × 4</text>
<text x="102.5" y="105.5" text-anchor="middle" fill="#333" font-size="13">completions</text>
<rect x="210" y="45" width="165" height="76" rx="9" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
<text x="292.5" y="69.5" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">2 · Score</text>
<text x="292.5" y="87.5" text-anchor="middle" fill="#333" font-size="13">reward 0 or 1</text>
<text x="292.5" y="105.5" text-anchor="middle" fill="#333" font-size="13">per completion</text>
<path d="M185,83 L208,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="400" y="45" width="165" height="76" rx="9" fill="#fdf0e4" stroke="#e07b2a" stroke-width="2"/>
<text x="482.5" y="69.5" text-anchor="middle" fill="#7a3f0f" font-size="13" font-weight="bold">3 · Advantage</text>
<text x="482.5" y="87.5" text-anchor="middle" fill="#7a3f0f" font-size="13">A = r − running</text>
<text x="482.5" y="105.5" text-anchor="middle" fill="#7a3f0f" font-size="13">average of rewards</text>
<path d="M375,83 L398,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="590" y="45" width="165" height="76" rx="9" fill="#e6f4ec" stroke="#2e9a5b" stroke-width="2"/>
<text x="672.5" y="69.5" text-anchor="middle" fill="#1b5e37" font-size="13" font-weight="bold">4 · Update (×1)</text>
<text x="672.5" y="87.5" text-anchor="middle" fill="#1b5e37" font-size="13">−A · log π(token)</text>
<text x="672.5" y="105.5" text-anchor="middle" fill="#1b5e37" font-size="13">+ β · KL(π ‖ π_ref)</text>
<path d="M565,83 L588,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M712,125 L712,150" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="700" y="165" text-anchor="end" fill="#777" font-size="11">repeat</text>
<text x="20" y="174" text-anchor="start" fill="#555" font-size="12" font-weight="bold">Models in GPU memory</text>
<rect x="20" y="182" width="25" height="24" rx="5" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="32.5" y="199" text-anchor="middle" fill="#1d3f6e" font-size="13" font-weight="bold">π</text>
<text x="53" y="199" text-anchor="start" fill="#555" font-size="12">policy (trained)</text>
<rect x="175.0" y="182" width="61" height="24" rx="5" fill="#f3f3f3" stroke="#777" stroke-width="1.5"/>
<text x="205.5" y="199" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">π_ref</text>
<text x="244.0" y="199" text-anchor="start" fill="#555" font-size="12">frozen copy of the start</text></svg>
