<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="368" fill="#ffffff"/><text x="20" y="26" text-anchor="start" fill="#333" font-size="13" font-weight="bold">PPO: a learned critic gives every token its own advantage</text>
<rect x="20" y="45" width="165" height="76" rx="9" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
<text x="102.5" y="69.5" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">1 · Sample</text>
<text x="102.5" y="87.5" text-anchor="middle" fill="#333" font-size="13">1 completion</text>
<text x="102.5" y="105.5" text-anchor="middle" fill="#333" font-size="13">per prompt</text>
<rect x="210" y="45" width="165" height="76" rx="9" fill="#f1eafa" stroke="#7a4fb5" stroke-width="2"/>
<text x="292.5" y="69.5" text-anchor="middle" fill="#47286f" font-size="13" font-weight="bold">2 · Score + critic</text>
<text x="292.5" y="87.5" text-anchor="middle" fill="#47286f" font-size="13">reward at the end,</text>
<text x="292.5" y="105.5" text-anchor="middle" fill="#47286f" font-size="13">V(t) at every token</text>
<path d="M185,83 L208,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="400" y="45" width="165" height="76" rx="9" fill="#fdf0e4" stroke="#e07b2a" stroke-width="2"/>
<text x="482.5" y="69.5" text-anchor="middle" fill="#7a3f0f" font-size="13" font-weight="bold">3 · Advantage (GAE)</text>
<text x="482.5" y="87.5" text-anchor="middle" fill="#7a3f0f" font-size="13">A_t from changes</text>
<text x="482.5" y="105.5" text-anchor="middle" fill="#7a3f0f" font-size="13">in V along the text</text>
<path d="M375,83 L398,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="590" y="45" width="165" height="76" rx="9" fill="#e6f4ec" stroke="#2e9a5b" stroke-width="2"/>
<text x="672.5" y="69.5" text-anchor="middle" fill="#1b5e37" font-size="13" font-weight="bold">4 · Update (×2)</text>
<text x="672.5" y="87.5" text-anchor="middle" fill="#1b5e37" font-size="13">π: clip(π/π_old) · A_t</text>
<text x="672.5" y="105.5" text-anchor="middle" fill="#1b5e37" font-size="13">V: regress to returns</text>
<path d="M565,83 L588,83" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="20" y="160" text-anchor="start" fill="#555" font-size="12" font-weight="bold">The critic reads the reply token by token and keeps guessing P(correct):</text>
<rect x="30" y="175" width="96" height="28" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
<text x="78.0" y="193.2" text-anchor="middle" fill="#1d3f6e" font-size="12">23*4</text>
<rect x="63" y="241.5" width="30" height="38.5" fill="#7a4fb5" opacity="0.75"/>
<text x="78" y="295" text-anchor="middle" fill="#47286f" font-size="11">V=0.55</text>
<rect x="140" y="175" width="96" height="28" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
<text x="188.0" y="193.2" text-anchor="middle" fill="#1d3f6e" font-size="12">=82</text>
<rect x="173" y="259.0" width="30" height="21.0" fill="#7a4fb5" opacity="0.75"/>
<text x="188" y="295" text-anchor="middle" fill="#47286f" font-size="11">V=0.30</text>
<rect x="250" y="175" width="96" height="28" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
<text x="298.0" y="193.2" text-anchor="middle" fill="#1d3f6e" font-size="12">+17</text>
<rect x="283" y="260.4" width="30" height="19.6" fill="#7a4fb5" opacity="0.75"/>
<text x="298" y="295" text-anchor="middle" fill="#47286f" font-size="11">V=0.28</text>
<rect x="360" y="175" width="96" height="28" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
<text x="408.0" y="193.2" text-anchor="middle" fill="#1d3f6e" font-size="12">=99</text>
<rect x="393" y="262.5" width="30" height="17.5" fill="#7a4fb5" opacity="0.75"/>
<text x="408" y="295" text-anchor="middle" fill="#47286f" font-size="11">V=0.25</text>
<rect x="470" y="175" width="96" height="28" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
<text x="518.0" y="193.2" text-anchor="middle" fill="#1d3f6e" font-size="12">&lt;answer&gt;99</text>
<rect x="503" y="276.5" width="30" height="3.5" fill="#7a4fb5" opacity="0.75"/>
<text x="518" y="295" text-anchor="middle" fill="#47286f" font-size="11">V=0.05</text>
<text x="590" y="200" text-anchor="start" fill="#777" font-size="12">The big drop at &quot;=82&quot;</text>
<text x="590" y="218" text-anchor="start" fill="#777" font-size="12">(the arithmetic slip)</text>
<text x="590" y="236" text-anchor="start" fill="#777" font-size="12">gets the most blame:</text>
<text x="590" y="254" text-anchor="start" fill="#777" font-size="12">credit per token,</text>
<text x="590" y="272" text-anchor="start" fill="#777" font-size="12">not per completion.</text>
<text x="20" y="327" text-anchor="start" fill="#555" font-size="12" font-weight="bold">Models in GPU memory</text>
<rect x="20" y="335" width="25" height="24" rx="5" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="32.5" y="352" text-anchor="middle" fill="#1d3f6e" font-size="13" font-weight="bold">π</text>
<text x="53" y="352" text-anchor="start" fill="#555" font-size="12">policy</text>
<rect x="110.0" y="335" width="61" height="24" rx="5" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.5"/>
<text x="140.5" y="352" text-anchor="middle" fill="#1d3f6e" font-size="13" font-weight="bold">π_old</text>
<text x="179.0" y="352" text-anchor="start" fill="#555" font-size="12">sampler</text>
<rect x="242.5" y="335" width="61" height="24" rx="5" fill="#f3f3f3" stroke="#777" stroke-width="1.5"/>
<text x="273.0" y="352" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">π_ref</text>
<text x="311.5" y="352" text-anchor="start" fill="#555" font-size="12">frozen start</text>
<rect x="407.5" y="335" width="25" height="24" rx="5" fill="#f1eafa" stroke="#7a4fb5" stroke-width="1.5"/>
<text x="420.0" y="352" text-anchor="middle" fill="#47286f" font-size="13" font-weight="bold">V</text>
<text x="440.5" y="352" text-anchor="start" fill="#555" font-size="12">critic: a 2nd trained LLM</text></svg>
