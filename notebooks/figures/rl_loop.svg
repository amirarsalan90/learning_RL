<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="760" height="250" fill="#ffffff"/>
  <rect x="20" y="85" width="150" height="70" rx="10" fill="#e8f0fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="95" y="114" text-anchor="middle" font-weight="bold" fill="#1d3f6e">Policy π</text>
  <text x="95" y="134" text-anchor="middle" fill="#1d3f6e">the LLM</text>
  <rect x="220" y="20" width="150" height="70" rx="10" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="295" y="49" text-anchor="middle" font-weight="bold" fill="#333">1 · Sample</text>
  <text x="295" y="69" text-anchor="middle" fill="#333">prompt → completion</text>
  <rect x="420" y="20" width="150" height="70" rx="10" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="495" y="49" text-anchor="middle" font-weight="bold" fill="#333">2 · Score</text>
  <text x="495" y="69" text-anchor="middle" fill="#333">reward r (0 or 1)</text>
  <rect x="590" y="110" width="150" height="70" rx="10" fill="#fdf0e4" stroke="#e07b2a" stroke-width="2"/>
  <text x="665" y="139" text-anchor="middle" font-weight="bold" fill="#7a3f0f">3 · Advantage</text>
  <text x="665" y="159" text-anchor="middle" fill="#7a3f0f">A = r − baseline</text>
  <rect x="300" y="160" width="200" height="70" rx="10" fill="#e6f4ec" stroke="#2e9a5b" stroke-width="2"/>
  <text x="400" y="189" text-anchor="middle" font-weight="bold" fill="#1b5e37">4 · Update</text>
  <text x="400" y="209" text-anchor="middle" fill="#1b5e37">loss = −A · log π(completion)</text>
  <path d="M170,105 L218,70" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M370,55 L418,55" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M570,70 L620,108" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M600,180 L502,195" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M300,195 L172,145" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="150" y="205" fill="#777" font-size="12">nudge π toward</text>
  <text x="150" y="220" fill="#777" font-size="12">high-A completions</text>
</svg>
