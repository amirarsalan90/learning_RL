[project]
name = "learning-rl"
version = "0.1.0"
description = "Learn RL for LLMs (REINFORCE, GRPO, PPO, DPO) by implementing it yourself"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy",
    "matplotlib",
    "ipykernel",
]

[dependency-groups]
# Plain Jupyter Lab, only needed if you use the browser instead of VS Code / Cursor.
jupyter = ["jupyterlab>=4"]
# Builds the exercise/solution notebooks from tools/lessons/*.py (course authoring only).
dev = ["nbformat>=5", "nbclient>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlcourse"]
